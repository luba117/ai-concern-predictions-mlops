apiVersion: v1
kind: ServiceAccount
metadata:
  name: churn-api-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secret-reader
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: churn-api-secret-access
subjects:
  - kind: ServiceAccount
    name: churn-api-reader
roleRef:
  kind: Role
  name: secret-reader
  apiGroup: rbac.authorization.k8s.io