apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: churn-api-allow-frontend
spec:
  podSelector:
    matchLabels:
      app: churn-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              role: frontend
      ports:
        - protocol: TCP
          port: 8000