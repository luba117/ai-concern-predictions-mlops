apiVersion: apps/v1
kind: Deployment
metadata:
  name: churn-api
  labels:
    app: churn-api
spec:
  nodeSelector:
    workload-type: gpu-only
  containers:
  - name: churn-api
  replicas: 4
  selector:
    matchLabels:
      app: churn-api
  template:
    metadata:
      labels:
        app: churn-api
    spec:
      containers:
      - name: churn-api
        image: churn-api:v1       
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        env:
        - name: DECISION_THRESHOLD
          valueFrom:
            configMapKeyRef:
              name: churn-api-config
              key: DECISION_THRESHOLD
        - name: NOTIFICATION_API_KEY
          valueFrom:
            secretKeyRef:
              name: churn-api-secret
              key: NOTIFICATION_API_KEY
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        volumeMounts:
        - name: churn-storage
          mountPath: /data
      volumes:
      - name: churn-storage
        persistentVolumeClaim:
          claimName: churn-api-storage