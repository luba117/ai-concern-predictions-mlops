apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: churn-api-rs
  labels:
    app: churn-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: churn-api
  template:
    metadata:
      labels:
        app: churn-api
    spec:
      containers:
      - name: churn-api
        image: churnmlops5624.azurecr.io/churn-api:v1       
        ports:
        - containerPort: 8000
        env:
        - name: DEMO_VERSION
          value: "2"